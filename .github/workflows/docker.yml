env:
  REGISTRY: ghcr.io

name: Build and Push Docker Images
on:
  push:
    branches:
      - review-3
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/review-3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert to lowercase
        id: lower
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.REPO_OWNER }}/${{ steps.lower.outputs.REPO_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.REPO_OWNER }}/${{ steps.lower.outputs.REPO_NAME }}/backend:${{ github.sha }}

      - name: Build and push Frontend Builder image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.REPO_OWNER }}/${{ steps.lower.outputs.REPO_NAME }}/frontend-builder:latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.REPO_OWNER }}/${{ steps.lower.outputs.REPO_NAME }}/frontend-builder:${{ github.sha }}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.REPO_OWNER }}/${{ steps.lower.outputs.REPO_NAME }}/nginx:latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.REPO_OWNER }}/${{ steps.lower.outputs.REPO_NAME }}/nginx:${{ github.sha }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/prac/film-react-nest
            docker compose pull
            docker compose up -d